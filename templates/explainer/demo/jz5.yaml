lines:
  - {id: JZ05_01, cap: "工地上做决定，环保价值只是一面，另一面是责任边界。", keys: [责任边界], pause: 0.6}
  - {id: JZ05_02, cap: "用了再生材料，后来出现裂缝、强度波动，或者验收有争议，这个责任算谁的？", keys: [裂缝, 强度波动, 验收有争议, 责任算谁的], pause: 0.7}
  - {id: JZ05_03, cap: "设计、施工、搅拌站、材料供应商、检测机构，没有明确的标准撑腰，谁都会倾向保守。", keys: [明确的标准, 倾向保守], pause: 0.6}
  - {id: JZ05_04, cap: "目前，再生产品的应用标准、检验方法、使用部位、掺配比例，都还在不断完善。", keys: [应用标准, 检验方法, 使用部位, 掺配比例], pause: 0.6}
  - {id: JZ05_05, cap: "国家和地方都在推进，但落到具体项目上，很多单位还是会问三个问题。", keys: [三个问题], pause: 0.5}
  - {id: JZ05_06, cap: "能不能用？用到哪里？验收怎么过？", keys: [能不能用, 用到哪里, 验收怎么过], pause: 0.7}
  - {id: JZ05_07, cap: "这三个问题答不清楚，再生骨料就很难从试点可用，变成常规可用。", keys: [试点可用, 常规可用], pause: 0.4}

