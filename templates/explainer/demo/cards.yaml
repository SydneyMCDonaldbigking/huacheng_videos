cards:
  - {kind: hook, from: 0, to: [JZ05_01, 0.25], kicker: "样式测试", title: "各种卡片\n*长什么样*？", line: "示意数据"}
  - {kind: stat, from: [JZ05_01, 0.3], to: JZ05_01, label: "分解温度", value: 1200, suffix: "℃以下", sub: "一句补充说明", y: 520}
  - {kind: stats, from: JZ05_02, to: JZ05_02, y: 460, rowH: 230, title: "两个*指标*",
     items: [{value: 95, suffix: "%+", label: "指标一", sub: "说明", at: [JZ05_02, 0.2]},
             {value: "3–6", suffix: "个月", count: false, label: "指标二", sub: "说明", at: [JZ05_02, 0.55]}]}
  - {kind: flow, from: JZ05_03, to: "JZ05_03+0.5", title: "料去了*哪里*", y: 380, h: 760,
     nodes: [{id: a, text: "产废方", x: 486, y: 170, tone: in, at: [JZ05_03, 0.05]},
             {id: b, text: "运输方", x: 486, y: 360, at: [JZ05_03, 0.3]},
             {id: c, text: "不合规去向", x: 270, y: 590, tone: waste, at: [JZ05_03, 0.5]},
             {id: d, text: "处置厂", x: 702, y: 590, tone: prod, at: [JZ05_03, 0.75]}],
     edges: [[a, b, "成本压到最低"], [b, c, "更便宜"], [b, d, "原料不足"]]}
  - {kind: compare, from: JZ05_04, to: [JZ05_04, 0.5], y: 420, rowH: 116, at: [[JZ05_04, 0.15], [JZ05_04, 0.3]],
     left: {title: "正规企业", items: ["无米下锅", "成本高"]}, right: {title: "非法倾倒", items: ["屡禁不止", "*成本低*"]}}
  - {kind: bars, from: [JZ05_04, 0.5], to: "JZ05_04+0.5", title: "产能对比（万吨/年）", y: 420, rowH: 170, legend: false,
     series: [{label: "全国总量", a: 14060, dec: 0, at: [JZ05_04, 0.75]}, {label: "其中某一类", a: 800, dec: 0, hi: true, at: [JZ05_04, 0.55]}]}
  - {kind: quad, from: JZ05_05, to: JZ05_05, y: 420, ch: 250, title: "四个*数字*",
     items: [{label: "投资", value: 30, suffix: "%", prefix: "省", sub: "示意", at: [JZ05_05, 0.1]},
             {label: "工期", value: 6, suffix: "个月", sub: "示意", at: [JZ05_05, 0.3]},
             {label: "产能", value: 10, suffix: "万吨", sub: "示意", at: [JZ05_05, 0.5]},
             {label: "回收率", value: 98.5, suffix: "%", sub: "示意", at: [JZ05_05, 0.7]}]}
  - {kind: route, from: JZ05_06, to: "JZ05_06+0.6", y: 420, idx: 2, name: "某一条技术路线", cap: "一句话说明这条路线",
     items: [{k: "原料", v: "副产石膏"}, {k: "产品", v: "硫磺 + 氧化钙"}, {k: "关键设备", v: "回转窑"}], invest: "投资：*约省三成*（示意）"}
  - {kind: eq, from: JZ05_07, to: "JZ05_07+0.3", y: 520, title: "石膏*还原*", step: "第一步",
     eq: "CaSO4 + 2C -> CaS + 2CO2", hi: [CaS], note: "示意方程式"}
  - {kind: note, from: [JZ05_01, 0.3], to: "JZ05_07+0.3", text: "以上为示意数据，仅用于检查卡片样式"}
